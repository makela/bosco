[package]
name = "bosco-web"
version = "0.1.0"
edition = "2024"
description = "Bosco's public site, the IHP app's Web/ ported to Rust, on the same PostgreSQL"
publish = false
default-run = "bosco-web"

[dependencies]
aes = "0.8"
axum = "0.8.1"
base64 = "0.22"
chrono = { version = "0.4.39", default-features = false, features = ["std", "clock"] }
ctr = "0.9"
getrandom = "0.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "sendmail-transport", "tokio1-rustls-tls", "hostname", "pool"] }
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
subtle = "2"
threefish = "0.5"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Only for its std feature: sqlx 0.9 turns it off, which leaves the stub that
# names every user "anonymous", so a DATABASE_URL without a user (as in
# development) logs in as "anonymous" instead of as the system user
whoami = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = "0.1"
skein = "0.1"
tower = { version = "0.5", features = ["util"] }
